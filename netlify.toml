[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/api/api/auth/:splat"
  status = 200

[[redirects]]
  from = "/api/student/*"
  to = "/.netlify/functions/api/api/student/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
